# Update `app` to the name you chose during `fly launch`, and
# `primary_region` to the Fly region closest to your users
# (e.g. iad, lhr, fra, syd — see `fly platform regions`).
app = "neutral-departure-api"
primary_region = "iad"

[build]

# Runs once per release, before the new machines accept traffic.
# Migrations live here so they don't re-run on every machine boot
# or autoscale event.
[deploy]
  release_command = "node migrate-up.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
