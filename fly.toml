# fly.toml app configuration file generated for my-backend-mymbpg on 2026-05-22T19:34:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'my-backend-mymbpg'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'node migrate-up.js'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
